<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senha do sudo — GoLiveBypass</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #14161c; color: #e8eaf0; font-size: 14px;
      }
      .wrap { padding: 20px 22px 18px; }
      h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
      p { margin: 0 0 12px; color: #a7adbb; line-height: 1.45; }
      p.error { color: #ff9d9d; }
      input {
        width: 100%; padding: 10px 12px; font-size: 14px; border-radius: 8px;
        border: 1px solid #3a3f4d; background: #0e1015; color: #e8eaf0; outline: none;
      }
      input:focus { border-color: #6b7cff; }
      .row { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
      button {
        padding: 9px 18px; font-size: 14px; border-radius: 8px; cursor: pointer;
        border: 1px solid #3a3f4d; background: #22262f; color: #e8eaf0;
      }
      button.primary { background: #5b6cff; border-color: #5b6cff; color: #fff; font-weight: 600; }
      button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Senha do sudo</h1>
      <p id="msg">O sistema não tem janela de senha (zenity/kdialog) nem autenticação polkit disponível, então o GoLiveBypass precisa da sua senha do sudo aqui para criar o túnel. A senha é usada uma vez e descartada.</p>
      <p class="error" id="err" hidden>A senha foi recusada. Tente de novo.</p>
      <input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Sua senha" />
      <div class="row">
        <button id="cancel" type="button">Cancelar</button>
        <button id="ok" type="button" class="primary">Autorizar</button>
      </div>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get("incorrect") === "1") {
          document.getElementById("err").hidden = false;
        }
        var input = document.getElementById("pw");
        var done = false;
        function send(value) {
          if (done) return;
          done = true;
          try {
            require("electron").ipcRenderer.send("sudo-password-response", value === null ? null : { password: value });
          } catch (e) {
            window.close();
          }
        }
        document.getElementById("ok").addEventListener("click", function () { send(input.value); });
        document.getElementById("cancel").addEventListener("click", function () { send(null); });
        input.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter") send(input.value);
          if (ev.key === "Escape") send(null);
        });
        window.addEventListener("DOMContentLoaded", function () { input.focus(); });
        input.focus();
      })();
    </script>
  </body>
</html>
