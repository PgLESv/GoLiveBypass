name: build-gui

# Manual de proposito: roda quando a gente dispara para uma tag de release, constroi os
# artefatos da GUI (exe Windows, AppImage Linux, dmg/zip macOS),
# gera os checksums consolidados e publica tudo de forma confiavel via GitHub Release API.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release que recebe os artefatos (ex.: v1.1.2)'
        required: true
        type: string
      canal:
        description: 'Canal da release: stable (padrao) ou beta (prerelease — so testadores com o opt-in da GUI recebem; /releases/latest nunca devolve prerelease)'
        required: false
        type: string
        default: stable

      rascunho:
        description: 'Manter como draft para conferir todos os artefatos antes de publicar'
        required: false
        type: boolean
        default: false

# O publisher respeita draft existente; o override também protege sua criação.
env:
  EP_DRAFT: ${{ inputs.rascunho && 'true' || 'false' }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/proton-confgen/go.mod
          cache-dependency-path: tools/proton-confgen/go.sum
      - run: npm ci
        working-directory: golive-gui
      - name: Build Windows Executable
        run: npm run build:win
        working-directory: golive-gui
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: golive-gui/dist-app/GoLiveBypass-*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/proton-confgen/go.mod
          cache-dependency-path: tools/proton-confgen/go.sum
      - run: npm ci
        working-directory: golive-gui
      - name: Build Linux AppImage
        run: npm run build:linux
        working-directory: golive-gui
      - name: Ensure Linux Update Metadata
        working-directory: golive-gui
        run: |
          if [ ! -f "dist-app/latest-linux.yml" ]; then
            node -e '
              const fs = require("fs");
              const crypto = require("crypto");
              const path = require("path");
              const file = fs.readdirSync("dist-app").find(f => f.endsWith(".AppImage"));
              if (!file) {
                console.error("AppImage not found in dist-app");
                process.exit(1);
              }
              const fullPath = path.join("dist-app", file);
              const stat = fs.statSync(fullPath);
              const buf = fs.readFileSync(fullPath);
              const hash = crypto.createHash("sha512").update(buf).digest("base64");
              const version = "${{ inputs.tag }}".replace(/^v/, "");
              const yml = `version: ${version}\nfiles:\n  - url: ${file}\n    sha512: ${hash}\n    size: ${stat.size}\npath: ${file}\nsha512: ${hash}\nreleaseDate: "${new Date().toISOString()}"\n`;
              fs.writeFileSync("dist-app/latest-linux.yml", yml);
              console.log("Generated dist-app/latest-linux.yml successfully");
            '
          fi
          if [ "${{ inputs.canal }}" = "beta" ]; then
            cp dist-app/latest-linux.yml dist-app/beta-linux.yml
          fi
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            golive-gui/dist-app/GoLiveBypass-*.AppImage
            golive-gui/dist-app/*-linux.yml
          if-no-files-found: error

  macos:
    if: ${{ inputs.canal != 'beta' }}
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/proton-confgen/go.mod
          cache-dependency-path: tools/proton-confgen/go.sum
      - run: npm ci
        working-directory: golive-gui
      - name: Build macOS GUI
        run: npm run build:mac
        working-directory: golive-gui
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            golive-gui/dist-app/*.dmg
            golive-gui/dist-app/*.zip
          if-no-files-found: ignore

  publish-release:
    runs-on: ubuntu-latest
    needs: [windows, linux, macos]
    if: always() && !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Criar pasta dos artefatos
        run: mkdir -p release-artifacts

      - name: Baixar todos os artefatos compilados
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Gerar checksum consolidado sha256.txt
        run: |
          cd release-artifacts
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          sha256sum GoLiveBypass-*.exe GoLiveBypass-*.AppImage *-linux.yml > "golivebypass-${VERSION}-sha256.txt" || true
          ls -la

      - name: Publicar Release no GitHub (Beta)
        if: ${{ inputs.canal == 'beta' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "GoLiveBypass ${{ inputs.tag }}"
          prerelease: true
          draft: ${{ inputs.rascunho || false }}
          body: "**Canal: beta** — versão de teste para quem optou em \"Participar dos testes\" nas configurações da GUI (Windows e Linux). Não é oferecida a quem usa o canal estável. Encontrou algo estranho? Abra uma issue no GitHub com o diagnóstico copiado."
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar Release no GitHub (Stable)
        if: ${{ inputs.canal != 'beta' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "GoLiveBypass ${{ inputs.tag }}"
          prerelease: false
          draft: false
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
