# Integração da API de bug reports — vhost DEDICADO bugs.golivebypass.dev (OpenLiteSpeed/CyberPanel)
#
# Este arquivo contém os dois blocos necessários:
#   1. `extProcessor golivebugapi`  -> cola em /usr/local/lsws/conf/httpd_config.conf (nível de servidor).
#      Se o bloco já existe (deploy antigo em api.skyplaceia.com), NÃO duplique: reutilize.
#   2. `context /bugs`              -> cola no vhost /usr/local/lsws/conf/vhosts/bugs.golivebypass.dev/vhost.conf,
#      sem substituir o resto do vhost gerado pelo CyberPanel nem o context ACME do painel.
#
# O rewrite [P] NAO funciona aqui ("Can not determine proxy host name" no OLS),
# por isso usamos o mesmo mecanismo dos demais serviços: context type=proxy.
#
# O contexto fica sob /bugs de propósito: o container atende com BASE_PATH=bugs
# e o mesmo handler serve também a contingência api.skyplaceia.com/bugs.

extProcessor golivebugapi {
  type                    proxy
  address                 127.0.0.1:8091
  maxConns                100
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context /bugs {
  type                    proxy
  handler                 golivebugapi
  addDefaultCharset       off
}
